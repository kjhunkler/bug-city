name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: |
          mkdir -p dist/public
          cp index.html style.css main.js art.js forest.js field-art.js encounter.js pond.js wonders.js meadow.js garden-net.js pages-net.js sw.js manifest.webmanifest dist/
          sed -i "s/^const CACHE = .*/const CACHE = \"bug-city-shell-$GITHUB_SHA\";/" dist/sw.js
          cp -r public/icons dist/public/
          cp -r vendor dist/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
