<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#29443b" />
    <title>Bug City · Pocket Meadow</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="public/icons/beetle-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main aria-label="Bug City multiplayer meadow">
      <canvas
        id="meadow"
        aria-label="Bug-catching meadow. Push the stick forward to walk and sideways to turn. Tap a bug to swipe the net. Arrow keys also work."
      ></canvas>
      <header>
        <div class="titleplate">
          <span class="rivets" aria-hidden="true"></span>
          <h1>BUG CITY</h1>
        </div>
        <div class="counter" aria-label="Bugs caught">
          <canvas id="jar" width="18" height="20" aria-hidden="true"></canvas
          ><strong id="count">0</strong>
        </div>
      </header>
      <div id="catch" role="status"></div>
      <div class="console">
        <div class="soundholes" aria-hidden="true"></div>
        <div
          id="stick"
          role="group"
          tabindex="0"
          aria-label="Movement stick. Up to walk, left and right to turn."
        >
          <i class="arrow up"></i><i class="arrow left"></i
          ><i class="arrow right"></i><span id="knob"></span>
        </div>
        <div class="friends" aria-label="Players in the meadow">
          <span id="light"></span><span id="players">1</span
          ><span class="person" aria-hidden="true"></span>
        </div>
      </div>
    </main>
    <script src="vendor/peerjs.min.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
